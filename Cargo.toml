[package]
name = "velatura-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Native backend core for the Velatura desktop shell"

[dependencies]
gdk4 = { version = "0.10.3", optional = true }
gtk4-sys = { version = "0.10.3", optional = true }
serde = "1"
serde_json = "1"

[features]
gdk4-observer = ["dep:gdk4", "dep:gtk4-sys"]
